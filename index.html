<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="10;url=https://flush-app-website.vercel.app/">
    <title>We've Moved</title>
    <style>
        :root {
            --background: #0b120c;
            --card: rgba(150, 201, 61, 0.04);
            --border: rgba(150, 201, 61, 0.15);
            --text: #f4f6ef;
            --text-secondary: rgba(244, 246, 239, 0.65);
            --tint: #96c93d;
            --tint-alt: #d4e8a3;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .ambient-blob {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, var(--tint) 0%, transparent 60%);
            opacity: 0.12;
            border-radius: 50%;
            filter: blur(40px);
            animation: floatBlob 12s ease-in-out infinite alternate;
            z-index: 0;
        }

        .ambient-blob-2 {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, var(--tint-alt) 0%, transparent 60%);
            opacity: 0.1;
            border-radius: 50%;
            filter: blur(40px);
            top: 20%;
            right: 10%;
            animation: floatBlob 14s ease-in-out infinite alternate-reverse;
            z-index: 0;
        }

        .shard {
            position: absolute;
            z-index: 0;
            animation: floatY 8s ease-in-out infinite, spin 25s linear infinite;
        }

        .shard-ring {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 1.5px dashed var(--border);
            top: 15%;
            left: 15%;
        }

        .shard-diamond {
            width: 45px;
            height: 45px;
            background-color: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            top: 70%;
            right: 20%;
            animation-duration: 10s, 30s;
            animation-direction: alternate, normal;
        }

        .shard-square {
            width: 60px;
            height: 60px;
            border: 1px solid var(--border);
            border-radius: 16px;
            bottom: 20%;
            left: 25%;
            animation-duration: 9s, 22s;
        }

        .flush-card {
            background: var(--card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 36px;
            padding: 48px 40px;
            text-align: center;
            max-width: 400px;
            width: 85%;
            z-index: 10;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .icon-container {
            width: 72px;
            height: 72px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 24px;
        }

        .icon-container svg {
            width: 32px;
            height: 32px;
            fill: none;
            stroke: var(--tint);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0 0 12px 0;
            color: var(--text);
        }

        p {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin: 0 0 32px 0;
        }

        .flush-btn {
            display: inline-block;
            background-color: var(--tint);
            color: var(--background);
            padding: 16px 32px;
            border-radius: 100px;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: -0.1px;
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s, box-shadow 0.2s;
            width: 100%;
            box-sizing: border-box;
        }

        .flush-btn:hover {
            transform: scale(0.97);
            opacity: 0.95;
            box-shadow: 0 0 20px rgba(150, 201, 61, 0.2);
        }

        .note {
            font-size: 13px;
            font-weight: 500;
            color: rgba(244, 246, 239, 0.4);
            margin-top: 24px;
            margin-bottom: 0;
        }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        @keyframes floatY {
            0%, 100% { transform: translateY(0) rotate(var(--rot, 0deg)); }
            50% { transform: translateY(-20px) rotate(var(--rot, 0deg)); }
        }

        @keyframes spin {
            0% { --rot: 0deg; transform: translateY(0) rotate(0deg); }
            100% { --rot: 360deg; transform: translateY(0) rotate(360deg); }
        }

        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="ambient-blob"></div>
    <div class="ambient-blob-2"></div>
    
    <div class="shard shard-ring"></div>
    <div class="shard shard-diamond"></div>
    <div class="shard shard-square"></div>

    <div class="flush-card">
        <div class="icon-container">
            <svg viewBox="0 0 24 24">
                <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
        </div>

        <h1>We've Moved</h1>
        <p>Flush has a new home. We've updated our infrastructure for future updates and a better experience.</p>
        
        <a href="https://flush-app-website.vercel.app/" class="flush-btn">Go to New Website</a>
        
        <p class="note">Redirecting automatically in a few seconds...</p>
    </div>

</body>
</html>
